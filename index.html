<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04040f}
  body{font-family:'Space Grotesk',sans-serif;cursor:none}

<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════════
//  SLIDE SURGE  —  The Designer's Arcade Escape
//  A Presentations.ai break game
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const TAU    = Math.PI * 2;

// ─── Canvas size helpers ─────────────────────────────────────────
const W = () => canvas.width;
const H = () => canvas.height;

// ─── roundRect polyfill ──────────────────────────────────────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r,y);
    this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y);
    this.closePath();
  };
}

// ─── Colour palette ──────────────────────────────────────────────
const C = {
  bg:      '#04040f',
  player:  '#00f5ff',
  pGlow:   '#7c3aed',
  bullet:  '#00f5ff',
  e0:      '#ff4d6d',   // Bullet Point – red-pink
  e1:      '#ffd60a',   // Clip Star    – gold
  e2:      '#06d6a0',   // Data Lance   – mint
  e3:      '#ff6b35',   // Slide Frame  – orange
  boss:    '#c44dff',   // Grand Deck   – violet
  gem:     '#ffd700',
  grid:    'rgba(100,50,200,0.04)',
  text:    '#f0f0ff',
  muted:   'rgba(180,160,255,0.55)',
};

// ─── Game state ──────────────────────────────────────────────────
const G = {
  mode: 'title',   // title | playing | boss | wave_clear | game_over
  score:     0,
  best:      +localStorage.getItem('ss_best') || 0,
  lives:     3,
  wave:      0,
  frame:     0,
  kills:     0,
  killGoal:  10,
  combo:     0,
  comboTTL:  0,
  inv:       0,   // invincibility frames after damage
  shakeX:    0,
  shakeY:    0,
  waveTimer: 0,
  newRecord: false,
  titleT:    0,
  goT:       0,   // game-over timer
};

// ─── Audio (Web Audio API synth) ─────────────────────────────────
const Audio = (() => {
  let ac;
  function tone(freq, type='sine', dur=0.12, vol=0.25, startFreq=0) {
    if (!ac) return;
    try {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = type;
      const f = startFreq || freq;
      o.frequency.setValueAtTime(f, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq, ac.currentTime + dur * 0.4);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.start(); o.stop(ac.currentTime + dur + 0.01);
    } catch(e) {}
  }
  return {
    init() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); },
    shoot()   { tone(1200,'square',0.06,0.08,2400); },
    hit()     { tone(180,'sawtooth',0.25,0.35,360); tone(120,'square',0.3,0.2,240); },
    collect() { tone(900,'sine',0.1,0.18,600); },
    die()     { tone(90,'sawtooth',0.6,0.45,180); },
    waveUp()  { tone(440,'sine',0.15,0.3); setTimeout(()=>tone(554,'sine',0.15,0.3),150); setTimeout(()=>tone(660,'sine',0.2,0.3),300); },
    boss()    { tone(110,'square',0.6,0.5,220); },
    comboUp() { tone(1320,'sine',0.12,0.22,880); },
  };
})();

// ─── Input ───────────────────────────────────────────────────────
const K  = new Set();
const M  = { x: W()/2, y: H()/2, down: false, clicked: false };
let touchMove = false;

// ─── Particles ───────────────────────────────────────────────────
const particles = [];

function spawnParticle(x,y,vx,vy,col,life=50,size=3) {
  particles.push({x,y,vx,vy,col,life,ml:life,size,glow:false});
}
function spawnBurst(x,y,col,n=20,speed=4) {
  for (let i=0;i<n;i++) {
    const a = TAU*i/n + Math.random()*0.4;
    const s = speed*(0.4+Math.random()*0.8);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,life:35+~~(Math.random()*30),ml:60,size:2+Math.random()*3,glow:true});
  }
}
function spawnTrail(x,y,col,n=1) {
  for (let i=0;i<n;i++) {
    particles.push({
      x: x+(Math.random()-.5)*12,
      y: y+(Math.random()-.5)*12,
      vx:(Math.random()-.5)*0.6,
      vy:(Math.random()-.5)*0.6,
      col,life:12+~~(Math.random()*12),ml:24,size:1.5+Math.random()*2,glow:false
    });
  }
}

function tickParticles() {
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.93; p.vy*=0.93;
    p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for (const p of particles) {
    const a = p.life/p.ml;
    ctx.globalAlpha = a*0.85;
    if (p.glow) { ctx.shadowBlur=8; ctx.shadowColor=p.col; }
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*a,0,TAU);
    ctx.fillStyle=p.col;
    ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

// ─── Background ──────────────────────────────────────────────────
const stars = Array.from({length:180},()=>({
  x: Math.random(), y: Math.random(),
  r: .4+Math.random()*1.4,
  sp: .04+Math.random()*.25,
  o: .2+Math.random()*.7
}));
const floatSlides = Array.from({length:10},(_,i)=>({
  x: Math.random(), y: Math.random(),
  rot: (Math.random()-.5)*.5,
  vx:(Math.random()-.5)*.0004,
  vy:(Math.random()-.5)*.0003,
  vr:(Math.random()-.5)*.0008,
  w: .09+Math.random()*.08,
  col:[C.pGlow,C.player,'#ec4899','#f59e0b','#06d6a0'][i%5],
  op: .05+Math.random()*.08
}));

let bgT = 0;
function drawBg() {
  bgT++;
  const bg = ctx.createLinearGradient(0,0,W(),H());
  const hue = (bgT*0.05)%360;
  bg.addColorStop(0,'#04040f');
  bg.addColorStop(.45,`hsl(${260+Math.sin(bgT*.01)*15},60%,7%)`);
  bg.addColorStop(1,`hsl(${280+Math.sin(bgT*.007)*20},55%,5%)`);
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W(),H());

  // grid
  ctx.strokeStyle=C.grid;
  ctx.lineWidth=1;
  const gs=70;
  for(let x=0;x<W();x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke();}
  for(let y=0;y<H();y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke();}

  // stars
  for(const s of stars){
    s.x-=s.sp*.00025;
    if(s.x<0){s.x=1;s.y=Math.random();}
    const tw = s.x*W(), th = s.y*H();
    const pulse = .7+Math.sin(bgT*.03+s.x*30)*.3;
    ctx.beginPath();
    ctx.arc(tw,th,s.r,0,TAU);
    ctx.fillStyle=`rgba(200,200,255,${s.o*pulse})`;
    ctx.fill();
  }

  // nebula glow blobs
  const ng1 = ctx.createRadialGradient(W()*.2,H()*.3,0,W()*.2,H()*.3,W()*.35);
  ng1.addColorStop(0,`rgba(124,58,237,${.04+Math.sin(bgT*.008)*.02})`);
  ng1.addColorStop(1,'transparent');
  ctx.fillStyle=ng1; ctx.fillRect(0,0,W(),H());

  const ng2 = ctx.createRadialGradient(W()*.8,H()*.7,0,W()*.8,H()*.7,W()*.3);
  ng2.addColorStop(0,`rgba(0,245,255,${.025+Math.sin(bgT*.01)*.015})`);
  ng2.addColorStop(1,'transparent');
  ctx.fillStyle=ng2; ctx.fillRect(0,0,W(),H());
}

// ─── Player ──────────────────────────────────────────────────────
const player = {
  x:0,y:0,r:15,
  vx:0,vy:0,
  angle:0,pulseT:0,
  speed:5,
  reset(){ this.x=W()/2; this.y=H()/2; this.vx=0; this.vy=0; },
  update(){
    let dx=0,dy=0;
    if(K.has('ArrowLeft')||K.has('a')||K.has('A')) dx-=1;
    if(K.has('ArrowRight')||K.has('d')||K.has('D')) dx+=1;
    if(K.has('ArrowUp')||K.has('w')||K.has('W')) dy-=1;
    if(K.has('ArrowDown')||K.has('s')||K.has('S')) dy+=1;
    if(dx&&dy){dx*=.707;dy*=.707;}
    this.vx=dx*this.speed; this.vy=dy*this.speed;
    this.x=Math.max(this.r,Math.min(W()-this.r,this.x+this.vx));
    this.y=Math.max(this.r,Math.min(H()-this.r,this.y+this.vy));
    if(dx||dy){
      this.angle=Math.atan2(dy,dx);
      spawnTrail(this.x,this.y,C.pGlow,1);
      if(Math.random()<.4) spawnTrail(this.x,this.y,C.player,1);
    }
    this.pulseT+=.07;
    if(G.inv>0) G.inv--;
  },
  draw(){
    const blink = G.inv>0 && Math.floor(G.frame/5)%2===0;
    if(blink) return;
    const p=Math.sin(this.pulseT)*3;
    ctx.save();
    // outer aura
    ctx.shadowBlur=25+p; ctx.shadowColor=C.pGlow;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r+5+p*.4,0,TAU);
    ctx.strokeStyle='rgba(124,58,237,.3)'; ctx.lineWidth=1.5; ctx.stroke();
    // body gradient
    const gr=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
    gr.addColorStop(0,'#fff');
    gr.addColorStop(.35,C.player);
    gr.addColorStop(1,'rgba(0,245,255,0)');
    ctx.shadowBlur=20; ctx.shadowColor=C.player;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,TAU);
    ctx.fillStyle=gr; ctx.fill();
    // direction dot
    const ax=this.x+Math.cos(this.angle)*(this.r+5);
    const ay=this.y+Math.sin(this.angle)*(this.r+5);
    ctx.beginPath(); ctx.arc(ax,ay,3,0,TAU);
    ctx.fillStyle='rgba(255,255,255,.7)'; ctx.shadowBlur=6; ctx.fill();
    ctx.restore();
  },
  hits(e){ const dx=this.x-e.x,dy=this.y-e.y; return dx*dx+dy*dy<(this.r+(e.hr||e.r||10))**2; }
};

// ─── Player bullets ──────────────────────────────────────────────
const pBullets = [];
let shootCooldown=0;

function shoot(){
  const angle=Math.atan2(M.y-player.y,M.x-player.x);
  const spd=11;
  pBullets.push({
    x:player.x+Math.cos(angle)*(player.r+6),
    y:player.y+Math.sin(angle)*(player.r+6),
    vx:Math.cos(angle)*spd,
    vy:Math.sin(angle)*spd,
    r:4, life:90,
    angle
  });
  spawnParticle(player.x,player.y,-Math.cos(angle)*2,-Math.sin(angle)*2,C.pGlow,14,4);
  Audio.shoot();
}

function tickBullets(){
  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    spawnTrail(b.x,b.y,C.player,1);
    if(b.life<=0||b.x<-20||b.x>W()+20||b.y<-20||b.y>H()+20) pBullets.splice(i,1);
  }
}

function drawBullets(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const b of pBullets){
    ctx.save();
    ctx.translate(b.x,b.y); ctx.rotate(b.angle);
    ctx.shadowBlur=12; ctx.shadowColor=C.bullet;
    const gr=ctx.createRadialGradient(0,0,0,0,0,b.r+4);
    gr.addColorStop(0,'#fff');
    gr.addColorStop(.4,C.bullet);
    gr.addColorStop(1,'transparent');
    ctx.beginPath(); ctx.ellipse(0,0,b.r+4,b.r,0,0,TAU);
    ctx.fillStyle=gr; ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

// ─── Enemies ─────────────────────────────────────────────────────
const enemies=[];

// Type → { col, points, hp, speed multiplier, draw fn, update fn }
const ETYPES=[
  // 0 – Bullet Point: fast small homing red dot
  {col:C.e0,pts:10,baseHp:1,spd:1.0},
  // 1 – Clip Star: slow spinning gold asterisk
  {col:C.e1,pts:25,baseHp:3,spd:0.55},
  // 2 – Data Lance: medium rect that moves straight
  {col:C.e2,pts:20,baseHp:2,spd:1.15},
  // 3 – Slide Frame: rotating 16:9 frame
  {col:C.e3,pts:30,baseHp:2,spd:0.7},
];

class Enemy{
  constructor(x,y,type){
    this.x=x; this.y=y; this.type=type; this.t=0; this.dead=false;
    const td=ETYPES[type];
    this.col=td.col;
    this.pts=td.pts;
    this.hp=td.baseHp;
    this.maxHp=this.hp;
    this.spd=(2.2+G.wave*.13)*td.spd;
    this.rot=Math.random()*TAU;
    this.rotSpd=(Math.random()>.5?1:-1)*(.015+Math.random()*.025);
    if(type===2){ // precompute direction
      const a=Math.atan2(player.y-y,player.x-x);
      this.vx=Math.cos(a)*this.spd;
      this.vy=Math.sin(a)*this.spd;
    }
    // hit radius
    switch(type){
      case 0: this.r=9; this.hr=8; break;
      case 1: this.r=22; this.hr=16; break;
      case 2: this.r=20; this.hr=14; break;
      case 3: this.r=28; this.hr=11; break;
    }
  }
  update(){
    this.t++;
    const dx=player.x-this.x, dy=player.y-this.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    switch(this.type){
      case 0: // homing
        this.x+=dx/dist*this.spd;
        this.y+=dy/dist*this.spd;
        if(this.t%3===0) spawnTrail(this.x,this.y,this.col,1);
        break;
      case 1: // zigzag toward player
        const perp=Math.atan2(dy,dx)+Math.PI/2;
        this.x+=dx/dist*this.spd*.75+Math.cos(perp)*Math.sin(this.t*.06)*1.8;
        this.y+=dy/dist*this.spd*.75+Math.sin(perp)*Math.sin(this.t*.06)*1.8;
        this.rot+=this.rotSpd;
        break;
      case 2: // straight
        this.x+=this.vx; this.y+=this.vy;
        break;
      case 3: // rotating approach
        this.x+=dx/dist*this.spd;
        this.y+=dy/dist*this.spd;
        this.rot+=this.rotSpd*1.5;
        break;
    }
    if(this.x<-120||this.x>W()+120||this.y<-120||this.y>H()+120) this.dead=true;
  }
  draw(){
    ctx.save();
    ctx.shadowBlur=14; ctx.shadowColor=this.col;
    switch(this.type){
      case 0:{
        const gr=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
        gr.addColorStop(0,'#fff'); gr.addColorStop(.4,this.col); gr.addColorStop(1,this.col+'44');
        ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,TAU);
        ctx.fillStyle=gr; ctx.fill();
        // speed tail
        const a=Math.atan2(player.y-this.y,player.x-this.x)+Math.PI;
        for(let i=1;i<=3;i++){
          ctx.beginPath();
          ctx.arc(this.x+Math.cos(a)*i*8,this.y+Math.sin(a)*i*8,this.r*(1-i*.28),0,TAU);
          ctx.fillStyle=this.col+['99','55','22'][i-1]; ctx.fill();
        }
        break;
      }
      case 1:{
        ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
        ctx.strokeStyle=this.col; ctx.lineWidth=3.5; ctx.lineCap='round';
        for(let i=0;i<6;i++){
          const a=TAU/6*i;
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*this.r,Math.sin(a)*this.r); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(Math.cos(a)*this.r*.4,Math.sin(a)*this.r*.4);
          ctx.lineTo(Math.cos(a+.5)*this.r*.8,Math.sin(a+.5)*this.r*.8); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0,0,6,0,TAU);
        ctx.fillStyle=this.col; ctx.fill();
        ctx.restore();
        break;
      }
      case 2:{
        ctx.save(); ctx.translate(this.x,this.y);
        ctx.rotate(Math.atan2(this.vy,this.vx)+Math.PI/2);
        ctx.beginPath(); ctx.roundRect(-7,-22,14,44,4);
        ctx.fillStyle=this.col+'55'; ctx.strokeStyle=this.col; ctx.lineWidth=2;
        ctx.fill(); ctx.stroke();
        // data fill lines
        for(let i=0;i<3;i++){
          ctx.fillStyle=this.col+'aa';
          ctx.fillRect(-5,-20+i*14,10,8);
        }
        ctx.restore();
        break;
      }
      case 3:{
        ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
        const fw=this.r*1.6, fh=this.r;
        ctx.beginPath(); ctx.roundRect(-fw,-fh,fw*2,fh*2,5);
        ctx.strokeStyle=this.col; ctx.lineWidth=2.5; ctx.stroke();
        // inner accent lines
        ctx.strokeStyle=this.col+'66'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(-fw+8,-fh); ctx.lineTo(-fw+8,fh); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-fw,-fh+8); ctx.lineTo(fw,-fh+8); ctx.stroke();
        ctx.restore();
        break;
      }
    }
    // HP pip dots
    if(this.maxHp>1){
      for(let i=0;i<this.maxHp;i++){
        const ox=(i-(this.maxHp-1)/2)*10;
        ctx.beginPath();ctx.arc(this.x+ox,this.y-this.r-8,3.5,0,TAU);
        ctx.fillStyle=i<this.hp?this.col:'rgba(255,255,255,0.15)';
        ctx.shadowColor=i<this.hp?this.col:'transparent';
        ctx.shadowBlur=i<this.hp?6:0;
        ctx.fill();
      }
    }
    ctx.restore();
  }
  onHit(){
    this.hp--;
    spawnBurst(this.x,this.y,this.col,6,3);
    if(this.hp<=0){
      this.dead=true;
      spawnBurst(this.x,this.y,this.col,18,5);
      G.kills++;
      addScore(this.pts*(G.combo||1));
      G.combo++;
      G.comboTTL=220;
      if(G.combo>0&&G.combo%5===0) Audio.comboUp();
      else Audio.collect();
      if(Math.random()<.35) spawnGem(this.x,this.y);
      return true;
    }
    return false;
  }
}

// ─── Boss ────────────────────────────────────────────────────────
let boss=null;
class Boss{
  constructor(){
    this.x=W()/2; this.y=-100;
    this.hp=80+G.wave*25; this.maxHp=this.hp;
    this.r=58; this.hr=42;
    this.vx=2.2+(G.wave*.15); this.vy=0;
    this.t=0; this.atkT=0; this.phase=0;
    this.rot=0; this.dead=false;
    this.bullets=[];
    this.targetY=H()/5;
    Audio.boss();
  }
  update(){
    this.t++; this.rot+=.018;
    if(this.y<this.targetY) this.y+=2.5;
    this.x+=this.vx;
    if(this.x>W()-this.r||this.x<this.r) this.vx*=-1;
    this.atkT++;
    const atkRate=this.phase===0?70:45;
    if(this.atkT>=atkRate){ this.atkT=0; this._attack(); }
    if(this.hp<this.maxHp*.5&&this.phase===0){
      this.phase=1; this.vx*=1.6;
      spawnBurst(this.x,this.y,C.boss,40,7);
      Audio.boss();
    }
    for(let i=this.bullets.length-1;i>=0;i--){
      const b=this.bullets[i];
      b.x+=b.vx; b.y+=b.vy; b.life--;
      if(b.life<=0||b.x<-30||b.x>W()+30||b.y>H()+30) this.bullets.splice(i,1);
    }
  }
  _attack(){
    const ang=Math.atan2(player.y-this.y,player.x-this.x);
    if(this.phase===0){
      for(let i=-1;i<=1;i++){
        const a=ang+i*.28;
        this.bullets.push({x:this.x,y:this.y,vx:Math.cos(a)*4.5,vy:Math.sin(a)*4.5,r:9,life:110});
      }
    } else {
      const n=10;
      for(let i=0;i<n;i++){
        const a=TAU*i/n+this.t*.04;
        this.bullets.push({x:this.x,y:this.y,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,r:9,life:120});
      }
    }
  }
  onHit(){
    this.hp-=1;
    spawnBurst(this.x,this.y,C.boss,4,2);
    if(this.hp<=0){ this.dead=true; return true; }
    return false;
  }
  draw(){
    ctx.save();
    ctx.shadowBlur=35; ctx.shadowColor=C.boss;
    ctx.translate(this.x,this.y);

    // rings
    for(let i=3;i>=0;i--){
      const rf=[1.4,1.2,1.0,.55][i];
      const sides=[6,6,6,3][i];
      const rotOff=[0,Math.PI/6,0,this.rot*-2][i];
      const alpha=['18','33','88','ff'][i];
      ctx.save(); ctx.rotate(this.rot*[.5,1,1.5,2][i]+rotOff);
      ctx.beginPath();
      for(let j=0;j<=sides;j++){
        const a=TAU/sides*j;
        j===0?ctx.moveTo(Math.cos(a)*this.r*rf,Math.sin(a)*this.r*rf)
             :ctx.lineTo(Math.cos(a)*this.r*rf,Math.sin(a)*this.r*rf);
      }
      ctx.closePath();
      if(i===3){ ctx.fillStyle='#fff'; ctx.fill(); }
      else { ctx.strokeStyle=C.boss; ctx.lineWidth=i===2?2.5:1.5; ctx.fillStyle=C.boss+alpha; ctx.fill(); ctx.stroke(); }
      ctx.restore();
    }
    // eye
    const eyePulse=Math.sin(this.t*.08)*.4+.6;
    ctx.beginPath(); ctx.arc(0,0,14,0,TAU);
    const eg=ctx.createRadialGradient(0,0,0,0,0,14);
    eg.addColorStop(0,'#fff'); eg.addColorStop(.4,'#ff2255'); eg.addColorStop(1,'#880022');
    ctx.fillStyle=eg; ctx.shadowBlur=20*eyePulse; ctx.shadowColor='#ff2255'; ctx.fill();
    ctx.restore();

    // boss bullets
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(const b of this.bullets){
      const gr2=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      gr2.addColorStop(0,'#fff'); gr2.addColorStop(.5,C.boss); gr2.addColorStop(1,C.boss+'33');
      ctx.shadowBlur=10; ctx.shadowColor=C.boss;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU);
      ctx.fillStyle=gr2; ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    ctx.restore();

    // HP bar
    const bw=Math.min(280,W()*.35), bh=10, bx=W()/2-bw/2, by=16;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,5); ctx.fill();
    const hpCol=this.hp/this.maxHp>.5?C.boss:'#ff2255';
    ctx.fillStyle=hpCol; ctx.shadowBlur=8; ctx.shadowColor=hpCol;
    ctx.beginPath(); ctx.roundRect(bx,by,bw*Math.max(0,this.hp/this.maxHp),bh,5); ctx.fill();
    ctx.shadowBlur=0;
    ctx.font='700 11px Space Mono,monospace'; ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.fillText('◆  THE GRAND DECK  ◆',W()/2,by+bh+14);
  }
  checksPlayer(){
    if(player.hits(this)) return true;
    for(const b of this.bullets) if(player.hits(b)) return true;
    return false;
  }
}

// ─── Gems ────────────────────────────────────────────────────────
const gems=[];
function spawnGem(x,y){
  const cols=['#ffd700','#ff6eb4','#00f5ff','#c44dff','#06d6a0'];
  gems.push({x,y,vx:(Math.random()-.5)*2.5,vy:-1.5-Math.random()*2,r:9,t:0,
    col:cols[~~(Math.random()*cols.length)],rot:Math.random()*TAU});
}
function tickGems(){
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];
    g.t++; g.x+=g.vx; g.y+=g.vy;
    g.vy+=.028; g.vx*=.98; g.rot+=.07;
    if(player.hits(g)){
      addScore(15);
      spawnBurst(g.x,g.y,g.col,10,3);
      Audio.collect();
      gems.splice(i,1);
    } else if(g.t>260||g.y>H()+40) gems.splice(i,1);
  }
}
function drawGems(){
  for(const g of gems){
    ctx.save();
    ctx.translate(g.x,g.y); ctx.rotate(g.rot+g.t*.04);
    ctx.shadowBlur=16; ctx.shadowColor=g.col;
    ctx.beginPath();
    ctx.moveTo(0,-g.r); ctx.lineTo(g.r*.55,0);
    ctx.lineTo(0,g.r); ctx.lineTo(-g.r*.55,0);
    ctx.closePath();
    const gr=ctx.createRadialGradient(0,0,0,0,0,g.r);
    gr.addColorStop(0,'#fff'); gr.addColorStop(.5,g.col); gr.addColorStop(1,g.col+'77');
    ctx.fillStyle=gr; ctx.fill();
    // sparkle
    if(g.t%15<4){
      ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1;
      for(let i=0;i<4;i++){
        const a=TAU/4*i+g.t*.05;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*(g.r+2),Math.sin(a)*(g.r+2));
        ctx.lineTo(Math.cos(a)*(g.r+6),Math.sin(a)*(g.r+6)); ctx.stroke();
      }
    }
    ctx.restore();
  }
}

let spawnT=0, spawnBoss=false;
function startWave(n){
  G.wave=n; G.kills=0; G.killGoal=8+n*3;
  enemies.length=0; gems.length=0;

    G.waveTimer=n===1?20:100;
  }
}
function spawnEnemy(){
  const edge=~~(Math.random()*4);
  let x,y; const pad=60;
  switch(edge){
    case 0: x=Math.random()*W(); y=-pad; break;
    case 1: x=W()+pad; y=Math.random()*H(); break;
    case 2: x=Math.random()*W(); y=H()+pad; break;

  }
  let type=0;
  if(G.wave>=2){ const r=Math.random(); type=G.wave>=5?~~(r*4):r<.55?0:~~(r*3); }

}

// ─── Start/damage/end ────────────────────────────────────────────
function startGame(){
  Object.assign(G,{mode:'playing',score:0,lives:3,wave:0,frame:0,
    kills:0,killGoal:10,combo:0,comboTTL:0,inv:0,shakeX:0,shakeY:0,goT:0,newRecord:false});
  enemies.length=0; gems.length=0; particles.length=0;
  pBullets.length=0; scorePopups.length=0; boss=null;
  M.clicked=false; K.clear();
  player.reset();
  Audio.init();
  startWave(1);
}

function takeDamage(){
  if(G.inv>0) return;
  G.lives--; G.inv=130; G.combo=0; G.comboTTL=0;
  Audio.hit();
  spawnBurst(player.x,player.y,'#ff4d6d',28,6);
  G.shakeX=14; G.shakeY=10;
  if(G.lives<=0){
    G.mode='game_over';
    G.newRecord=G.score>0&&G.score>=G.best;
    G.best=Math.max(G.best,G.score);
    localStorage.setItem('ss_best',G.best);
    Audio.die();
  }
}

// ─── Update ──────────────────────────────────────────────────────
function update(){
  G.frame++;
  G.shakeX*=.78; G.shakeY*=.78;
  if(G.comboTTL>0){ G.comboTTL--; if(G.comboTTL<=0) G.combo=0; }

  const playing = G.mode==='playing'||G.mode==='boss';

  if(playing){
    player.update();
    tickParticles(); tickGems(); tickBullets(); tickScorePopups();

    // Auto-shoot
    shootCooldown--;
    if(shootCooldown<=0&&(K.has(' ')||K.has('Control')||M.down)){
      shoot(); shootCooldown=10;
    }

    // Bullet–enemy collisions
    for(let bi=pBullets.length-1;bi>=0;bi--){
      const b=pBullets[bi];
      let hit=false;
      if(G.mode==='boss'&&boss&&!boss.dead){
        const dx=b.x-boss.x,dy=b.y-boss.y;
        if(dx*dx+dy*dy<(b.r+boss.hr)**2){
          boss.onHit(); pBullets.splice(bi,1); hit=true;
        }
      } else {
        for(let ei=enemies.length-1;ei>=0;ei--){
          const e=enemies[ei];
          const dx=b.x-e.x,dy=b.y-e.y;
          if(dx*dx+dy*dy<(b.r+e.hr)**2){
            e.onHit(); pBullets.splice(bi,1); hit=true;
            break;
          }
        }
      }
    }

    // Remove dead enemies
    for(let i=enemies.length-1;i>=0;i--) if(enemies[i].dead) enemies.splice(i,1);
    // Update live enemies + player collision
    for(const e of enemies){ e.update(); if(player.hits(e)) takeDamage(); }

    if(G.mode==='boss'&&boss){
      boss.update();
      if(boss.checksPlayer()) takeDamage();
      if(boss.dead){
        boss=null;
        addScore(600*G.wave);
        spawnBurst(W()/2,H()/3,C.boss,60,8);
        Audio.waveUp();
        for(let i=0;i<12;i++) spawnGem(Math.random()*W()*.8+W()*.1,Math.random()*H()*.6+H()*.1);
        G.mode='wave_clear'; G.waveTimer=160;
      }
    } else if(G.mode==='playing'){
      // Spawn enemies
      const spawnInterval=Math.max(18,72-G.wave*4);
      spawnT++;
      if(spawnT>=spawnInterval){
        spawnT=0;
        const n=Math.min(4,1+~~(G.wave/3));
        for(let i=0;i<n;i++) spawnEnemy();
      }
      // Wave complete check
      if(G.kills>=G.killGoal&&enemies.length===0){
        Audio.waveUp();
        startWave(G.wave+1);
      }
    }
  } else if(G.mode==='wave_clear'){
    tickParticles(); tickScorePopups();
  }
}

// ─── Draw ────────────────────────────────────────────────────────
function draw(){
  ctx.save();
  if(Math.abs(G.shakeX)>.4||Math.abs(G.shakeY)>.4){
    ctx.translate((Math.random()-.5)*G.shakeX*2,(Math.random()-.5)*G.shakeY*2);
  }

  drawBg();

  if(G.mode==='title'){
    drawTitle();
  } else {
    drawGems();
    drawParticles();
    drawBullets();
    for(const e of enemies) e.draw();
    if(boss) boss.draw();
    player.draw();
    drawScorePopups();
    drawHUD();
    if(G.mode==='wave_clear') drawWaveClear();
    if(G.mode==='game_over') drawGameOver();
  }

  drawCursor();
  ctx.restore();
}

// ─── Resize ──────────────────────────────────────────────────────
function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

// ─── Events ──────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{
  K.add(e.key);
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if(G.mode==='title'&&(e.key==='Enter'||e.key===' ')) startGame();
  if(G.mode==='game_over'&&(e.key==='Enter'||e.key===' ')) startGame();
});
window.addEventListener('keyup',e=>K.delete(e.key));

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  M.x=e.clientX-r.left; M.y=e.clientY-r.top;
});
canvas.addEventListener('mousedown',e=>{
  const r=canvas.getBoundingClientRect();
  M.x=e.clientX-r.left; M.y=e.clientY-r.top;
  M.down=true; M.clicked=true;
  if(G.mode==='title') startGame();
});
canvas.addEventListener('mouseup',()=>{ M.down=false; });

// Touch
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  M.x=t.clientX-r.left; M.y=t.clientY-r.top;
  M.down=true; M.clicked=true;
  if(G.mode==='title') startGame();
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  M.x=t.clientX-r.left; M.y=t.clientY-r.top;
  if(G.mode==='playing'||G.mode==='boss'){
    player.x=Math.max(player.r,Math.min(W()-player.r,M.x));
    player.y=Math.max(player.r,Math.min(H()-player.r,M.y));
    spawnTrail(player.x,player.y,C.pGlow,1);
    shootCooldown--;
    if(shootCooldown<=0){ shoot(); shootCooldown=14; }
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{ e.preventDefault(); M.down=false; },{passive:false});

window.addEventListener('resize',resize);

// ─── Boot ────────────────────────────────────────────────────────
resize();
player.reset();
(function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
